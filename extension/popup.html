<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HyperTorrent Catch</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      width: 320px;
      background: #090e1a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .brand {
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.05em;
    }
    .brand span { color: #00f2fe; }
    .status-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      font-weight: 700;
    }
    .status-badge.offline {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }
    .stats {
      display: flex;
      justify-content: space-between;
      background: rgba(255,255,255,0.03);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .stats strong { color: #00f2fe; font-family: monospace; font-size: 13px; }
    .input-box {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
      outline: none;
      margin-bottom: 10px;
      font-family: monospace;
    }
    .btn {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      color: #060b16;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">HYPER<span>TORRENT</span></div>
    <div class="status-badge" id="popup-status">CHECKING...</div>
  </div>

  <div class="stats">
    <div>Down: <strong id="popup-speed">0 B/s</strong></div>
    <div>Torrents: <strong id="popup-torrents">0</strong></div>
  </div>

  <input type="text" id="popup-magnet-input" class="input-box" placeholder="Paste magnet link...">
  <button class="btn" id="btn-popup-add">Download Now</button>
  <button class="btn btn-secondary" id="btn-popup-dashboard">Open Web Dashboard</button>

  <script src="popup.js"></script>
</body>
</html>
